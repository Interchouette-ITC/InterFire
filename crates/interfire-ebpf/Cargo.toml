[package]
name = "interfire-ebpf"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "TCP-connect observation contract and aya loader"

[features]
default = ["loader"]
loader = ["dep:aya", "dep:thiserror"]

[dependencies]
aya = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

[dev-dependencies]
object = "0.36"

[lib]
path = "src/lib.rs"
