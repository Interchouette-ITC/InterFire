# Paths excluded from Codecov totals.
# Plain folder paths only (Codecov treats entries as regex; avoid ** bombs).
# Upload token stays in GitHub Actions secrets, not here.
#
# Patch must be blocking (not informational). Project uses `auto` so pre-existing
# misses do not fail every PR; new lines still need 100% patch coverage.
codecov:
  require_ci_to_pass: true
  notify:
    wait_for_ci: true

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0%
        informational: false
    patch:
      default:
        target: 100%
        threshold: 0%
        informational: false

ignore:
  - "scripts"
  - "fixtures"
  - "crates/interfire-ebpf-programs"
  - "crates/interfire-daemon/src/main.rs"
  - "crates/interfirectl/src/main.rs"
