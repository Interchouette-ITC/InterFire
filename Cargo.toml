[workspace]
members = [
  "crates/interfire-rules",
  "crates/interfire-proto",
  "crates/interfire-daemon",
  "crates/interfire-ebpf",
  "crates/interfire-ebpf-programs",
  "crates/interfirectl",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1"
aya = "0.13"
aya-ebpf = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
nfq = "0.2.5"
nix = { version = "0.29", features = ["net", "poll", "user"] }
