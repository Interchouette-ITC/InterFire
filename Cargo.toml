[workspace]
members = [
  "crates/interfire-rules",
  "crates/interfire-proto",
  "crates/interfire-daemon",
  "crates/interfire-ebpf",
  "crates/interfire-ebpf-programs",
  "crates/interfirectl",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1"
aya-ebpf = "0.2"
