[package]
name = "interfire-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "InterFire GPUI desktop client (tray and rules-first main window)"

[[bin]]
name = "interfire-ui"
path = "src/main.rs"

[features]
# Optional [hotpath-rs](https://hotpath.rs/) profiling. Default builds stay cold.
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath/hotpath-alloc"]

[dependencies]
gpui-kit = { workspace = true }
hotpath = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
interfire-proto = { path = "../crates/interfire-proto" }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }
