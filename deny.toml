# cargo-deny configuration (run: `make deny`)
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false

[advisories]
yanked = "warn"
# Fail only if a direct workspace crate is unmaintained (GPUI pulls several).
unmaintained = "workspace"

[licenses]
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "OpenSSL",
    "CDLA-Permissive-2.0",
    # GPUI transitive (ahash / tiny-keccak, webbrowser, bzip2, etc.).
    "CC0-1.0",
    "MPL-2.0",
    "0BSD",
    "bzip2-1.0.6",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
